name: Seq MCP improvement
description: Propose a change to the plugin's tools or IDE integration.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: What investigation or workflow should this support?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include an example tool call or IDE interaction when useful.
    validations:
      required: true
