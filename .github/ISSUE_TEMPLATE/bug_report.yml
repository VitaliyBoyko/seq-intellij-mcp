name: Seq MCP bug
description: Report a problem with the IDE plugin or a Seq MCP tool.
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Plugin version, IDE build and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and result
      description: Include the tool name, sanitized arguments, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove API keys, embedded credentials and private log data before submitting.
      render: text
