name: Run UI Tests
on:
  workflow_dispatch

jobs:

  testUI:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
          cache-read-only: true

      - name: Test buttons and workspace grid
        run: gradle test --tests 'com.vitaliiboiko.seqmcp.SeqMcpUiTest' --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}
          path: build/reports/tests/test
