# Runs the real Swing component tests in the IntelliJ platform test framework.
# No external Seq server or robot-server plugin is required.

name: Run UI Tests
on:
  workflow_dispatch

jobs:

  testUI:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test buttons and workspace grid
        run: ./gradlew test --tests 'com.vitaliiboiko.seqmcp.SeqMcpUiTest' --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}
          path: build/reports/tests/test
