name: Publish Plugin

on:
  release:
    types: [ prereleased, released ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      GITHUB_RELEASE_ID: ${{ github.event.release.id }}

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
          cache-read-only: true

      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          mkdir -p build/tmp
          printf '%s\n' "$CHANGELOG" > build/tmp/release_note.txt
          gradle patchChangelog --release-note-file=build/tmp/release_note.txt

      - name: Run publish plugin
        env:
          JET_BRAINS_TOKEN: ${{ secrets.JET_BRAINS_TOKEN }}
        run: gradle publishPlugin -i --no-daemon
