name: Build
on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: Build plugin
        run: gradle buildPlugin

      - name: Expand packaged plugin
        shell: bash
        run: |
          mkdir -p build/distributions/content
          for archive in build/distributions/*.zip; do
            unzip -q "$archive" -d build/distributions/content
          done
      - name: Save plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: seq-mcp-plugin
          path: build/distributions/content/*/*
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    needs: [ build ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    defaults:
      run:
        shell: bash
    steps:

      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: Run Tests
        run: gradle check --no-daemon --no-build-cache --no-configuration-cache --console=plain

      - name: Collect Tests Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{ matrix.os }}
          retention-days: 14
          path: |
            build/reports/tests
            build/test-results
            build/reports/problems

  verify:
    name: Verify plugin
    needs: [ build, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: gradle verifyPlugin --no-daemon --no-configuration-cache --console=plain

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
          retention-days: 14

  license:
    name: License check
    needs: [ test ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
      - name: Check SPDX notices and license texts
        uses: fsfe/reuse-action@v6

  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify, license ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
          cache-read-only: true

      - name: Refresh release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          while read -r draft_id; do
            gh api --method DELETE "repos/${{ github.repository }}/releases/$draft_id"
          done < <(gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft) | .id')
          version=$(gradle properties --property version --quiet --console=plain | sed -n 's/^version: //p')
          notes=build/tmp/release_note.txt
          mkdir -p build/tmp
          gradle getChangelog --project-version "$version" --no-header --quiet --console=plain --output-file="$notes"
          gh release create "$version" --draft --target "$GITHUB_SHA" --title "$version" --notes-file "$notes"
