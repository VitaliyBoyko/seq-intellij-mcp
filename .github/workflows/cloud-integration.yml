name: Cloud integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seq-cloud-integration
  cancel-in-progress: false

jobs:
  cloud-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: seq-cloud-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Run remote Seq integration tests
        env:
          SEQ_TEST_SERVER_URL: ${{ vars.SEQ_TEST_SERVER_URL }}
          SEQ_TEST_API_KEY: ${{ secrets.SEQ_TEST_API_KEY }}
          SEQ_TEST_INGEST_API_KEY: ${{ secrets.SEQ_TEST_INGEST_API_KEY }}
        run: gradle cloudIntegrationTest sandboxUiTest --no-configuration-cache --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-integration-results
          path: |
            build/reports/tests/cloudIntegrationTest
            build/test-results/cloudIntegrationTest
            build/reports/tests/sandboxUiTest
            build/test-results/sandboxUiTest
          if-no-files-found: ignore
